# One-click deploy on Render: New + > Blueprint > pick this repo
services:
  - type: web
    name: flowly
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
